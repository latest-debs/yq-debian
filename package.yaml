# Package definition for yq

package_name: yq-go
github_repo: mikefarah/yq
license: MIT
artifact_format: tar.gz
description: "A lightweight and portable command-line YAML, JSON and XML processor"
license: MIT

# mikefarah/yq embeds the OS/arch suffix directly in the binary's own
# filename inside each release tarball (e.g. "yq_linux_amd64",
# "yq_linux_loong64"), not a plain "yq" - rename it to the expected
# command name after install.
binary_rename: yq

# Build for all Debian suites and all supported architectures.

# Binaries that must not be smoke-tested with --version (not standalone CLIs).
# mikefarah/yq >= 4.54 ships install-man-page.sh in the release tarball
# alongside yq_linux_* and yq.1; the builder places it in /usr/bin next to
# yq, and it is a helper script that reports no version, so the smoke gate
# has to waive it. Kept as a same-line scalar: this repo's read_val only
# parses scalar values, so a block list would read back empty.
smoke_skip: "install-man-page.sh"

# The command this package is expected to provide. package_name is the
# *package* name and is not the same thing - it is yq-go, to avoid
# colliding with Debian's unrelated Python `yq`. The smoke gate otherwise
# only checks that some binary in /usr/bin reports the right version, which
# stayed green while the package shipped as /usr/bin/yq_linux_amd64 and
# nobody had a working `yq`.
smoke_binary: "yq"

# Opt into native Ubuntu builds (builder >= v.0.1a29). Packages without
# these are served from the Debian suites via the alias fallback.
ubuntu_distributions:
  - jammy
  - noble
  - resolute
